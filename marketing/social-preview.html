<!doctype html>
<meta charset="utf-8">
<style>
  /* GitHub renders the social preview at 1280x640. */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #F2EDDE;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* The notch itself, hanging from the top edge exactly as the product does. */
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 700px; height: 88px;
    background: #0E0F11;
    border-radius: 0 0 30px 30px;
    display: flex; align-items: center;
    padding: 0 28px;
    box-sizing: border-box;
    box-shadow: 0 14px 34px rgba(14, 15, 17, 0.20);
  }
  .status { display: flex; align-items: center; gap: 13px; }
  .orb { display: flex; gap: 4px; align-items: center; }
  .orb i { width: 7px; height: 7px; border-radius: 50%; background: #FFB847; display: block; }
  .orb i:nth-child(1) { opacity: .55; }
  .orb i:nth-child(2) { opacity: 1; height: 11px; border-radius: 4px; }
  .orb i:nth-child(3) { opacity: .35; }
  .status span {
    color: rgba(242, 237, 222, .94);
    font-size: 21px; font-weight: 600; letter-spacing: -0.1px;
  }
  /* The hardware notch: the app leaves this gap empty. */
  .gap { flex: 1; }
  .cast { display: flex; gap: 9px; align-items: center; }

  .plate { position: absolute; left: 0; right: 0; top: 196px; text-align: center; }
  h1 {
    margin: 0;
    font-family: "SF Mono", SFMono-Regular, Menlo, monospace;
    font-size: 88px; font-weight: 700; letter-spacing: 7px;
    color: #15171C;
  }
  .rule {
    width: 96px; height: 3px; border-radius: 2px; background: #FF4F4F;
    margin: 34px auto 0;
  }
  p {
    margin: 38px auto 0; max-width: 900px;
    font-size: 34px; line-height: 1.36; font-weight: 450;
    color: rgba(21, 23, 28, .70);
  }
  p b { font-weight: 650; color: rgba(21, 23, 28, .93); }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 60px;
    display: flex; justify-content: center; align-items: center; gap: 15px;
    font-size: 20px; font-weight: 550; color: rgba(21, 23, 28, .42);
  }
  .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(21,23,28,.22); }
</style>

<div class="notch">
  <div class="status">
    <span class="orb"><i></i><i></i><i></i></span>
    <span>2 needs you</span>
  </div>
  <div class="gap"></div>
  <div class="cast">
    <!-- Pip, Stub, Ring, Beam, Sage, Doc: the documented silhouettes, in their own colours. -->
    <svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 5h18a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-8l-6 5v-5H6a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" fill="#FF4F4F"/></svg>
    <svg width="30" height="30" viewBox="0 0 30 30"><rect x="3" y="6" width="24" height="18" rx="3" fill="#FAB040"/><circle cx="3" cy="15" r="2.7" fill="#0E0F11"/><circle cx="27" cy="15" r="2.7" fill="#0E0F11"/></svg>
    <svg width="30" height="30" viewBox="0 0 30 30"><path d="M8 4c-3 0-5 2-5 5 0 9 9 18 18 18 3 0 5-2 5-5l-6-3-3 4c-4-2-7-5-9-9l4-3-4-7z" fill="#45D98F"/></svg>
    <svg width="30" height="30" viewBox="0 0 30 30"><rect x="4" y="5" width="22" height="20" rx="4" fill="#5C9EFF"/><path d="M9 20l5-7 4 4 3-4" stroke="#0E0F11" stroke-opacity=".45" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="16" r="10" fill="#A88FFF"/><circle cx="24" cy="7" r="3.4" fill="#A88FFF"/></svg>
    <svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 3l11 4v9c0 6-5 10-11 11-6-1-11-5-11-11V7l11-4z" fill="#2ECCB3"/><path d="M15 11v8M11 15h8" stroke="#0E0F11" stroke-opacity=".42" stroke-width="2.6" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="plate">
  <h1>XYNE ISLAND</h1>
  <div class="rule"></div>
  <p>Everything from <b>Xyne Spaces</b> that needs you,<br>in the MacBook notch.</p>
</div>

<div class="foot">
  <span>Mentions</span><span class="dot"></span>
  <span>Agents</span><span class="dot"></span>
  <span>Calls</span><span class="dot"></span>
  <span>Tickets</span><span class="dot"></span>
  <span>Approvals</span>
</div>
